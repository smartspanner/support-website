<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en_GB' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/images/smartspanner-moved.png' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="en_GB">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} | {{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/images/smartspanner-moved.png' | absolute_url }}">

  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  <style>
    .landing-page {
      margin: 0;
      background: #f7f8fa;
      color: #2e3035;
    }

    .landing {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .landing-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .landing-image,
    .landing-image img {
      display: block;
    }

    .landing-image img {
      width: min(520px, calc(100vw - 2rem)) !important;
      max-width: min(520px, calc(100vw - 2rem)) !important;
      height: auto !important;
      margin: 0 !important;
      border-radius: 0 !important;
      object-fit: contain;
      box-shadow: 0 18px 44px rgba(46, 48, 53, 0.16);
    }

    .landing-login {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      margin: 1.25rem auto 0 !important;
      padding: 0 1.25rem;
      background: #feb900;
      color: #1f2328;
      border: 1px solid #e5a700;
      border-radius: 0.375rem;
      font-size: 0.9375rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(46, 48, 53, 0.14);
    }
  </style>
  {% seo title=false %}
</head>
<body class="landing-page">
  {{ content }}
</body>
</html>
